<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBX EDGE AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>:root{--bg:#0b0f14;--card:#121923;--tx:#e6edf3;--mu:#8b98a5;--g:#22c55e;--r:#ef4444;--y:#eab308}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px system-ui}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--card);position:sticky;top:0;z-index:5;align-items:center}
button{background:#1e2a38;color:var(--tx);border:0;padding:6px 10px;border-radius:6px}button.on{background:#2563eb}
input,select{background:#0b0f14;color:var(--tx);border:1px solid #263447;border-radius:6px;padding:5px;width:90px}
#chart{height:320px}.card{margin:8px;padding:12px;background:var(--card);border-radius:10px;overflow-x:auto}
.buy{color:var(--g)}.sell{color:var(--r)}.nt{color:var(--y)}.mu{color:var(--mu)}.warn{background:#7f1d1d;padding:8px;border-radius:6px;margin:6px 0}
table{width:100%;border-collapse:collapse}td,th{padding:3px 6px;text-align:left;white-space:nowrap}h3{margin:4px 0}</style></head><body>
<nav id="nav"></nav><div id="main"></div>
<script>
const S={view:"Dashboard",sym:"BTCUSD",tf:"15m"},$=id=>document.getElementById(id);
const TFS=["1m","5m","15m","1h","4h"],VIEWS=["Dashboard","BTCUSD","XAUUSD","History","Backtest","Settings"];
const COST={BTCUSD:[10,5,0.0002],XAUUSD:[0.3,0.1,0]};
let ws=null,chart=null,tmr=null;
async function api(u,o){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw d.detail||r.statusText;return d}
const bt=(txt,on,fn)=>{const b=document.createElement("button");b.textContent=txt;if(on)b.className="on";b.onclick=fn;return b};
function nav(){$("nav").replaceChildren(...VIEWS.map(v=>bt(v,S.view==v,()=>{S.view=v;if(v=="BTCUSD"||v=="XAUUSD")S.sym=v;go()})),document.createElement("span"),...TFS.map(t=>bt(t,S.tf==t,()=>{S.tf=t;go()})))}
function stop(){if(ws){ws.onclose=null;ws.close();ws=null}if(chart){chart.remove();chart=null}clearInterval(tmr)}
function go(){stop();nav();({Dashboard,BTCUSD:chartView,XAUUSD:chartView,History,Backtest,Settings})[S.view]()}
const fx=(x,d=2)=>x==null?"-":Number(x).toFixed(d);
function card(g){const c=g.side=="BUY"?"buy":g.side=="SELL"?"sell":"nt";
 let h=`<h3 class="${c}">${g.instrument} ${g.timeframe}: ${g.side} <span class="mu">${g.strategy} · HTF ${g.htf} ${g.htf_trend||""}</span></h3>`;
 if(g.warning)h+=`<div class="warn">${g.warning}</div>`;
 if(g.entry)h+=`<table><tr><td>Entry</td><td>${g.entry}</td><td>SL</td><td>${g.stop_loss}</td></tr>`+g.take_profit.map((t,i)=>`<tr><td>TP${i+1}</td><td>${t}</td><td>R:R</td><td>1:${g.risk_reward[i]}</td></tr>`).join("")+`<tr><td>Confidence</td><td>${g.confidence}/100</td><td>Expires</td><td>${g.expires_at.slice(11,16)}Z</td></tr></table><p class="mu">Invalidation: ${g.invalidation.join(" · ")}</p>`;
 h+=`<p>${(g.reasons||[]).join(" · ")}</p>`;
 if(g.breakdown)h+=`<p class="mu">${g.breakdown.map(b=>(b.met?"✓ ":"✗ ")+b.factor+" ("+b.weight+")").join(" | ")}</p>`;
 if(g.indicators)h+=`<p class="mu">${Object.entries(g.indicators).map(([k,v])=>k+" "+v).join(" · ")}</p>`;
 if(g.nearest_support||g.nearest_resistance)h+=`<p class="mu">Support ${fx(g.nearest_support)} · Resistance ${fx(g.nearest_resistance)}</p>`;
 return h}
async function Dashboard(){$("main").innerHTML=`<div class="card mu">Loading both instruments…</div>`;
 const load=async()=>{const parts=[];for(const s of["BTCUSD","XAUUSD"]){try{const g=await api(`/api/signal/${s}/${S.tf}`),c=await api(`/api/candles/${s}/${S.tf}`);
  parts.push(`<div class="card"><div class="mu">${c.provider} · last close ${fx(c.candles.at(-1).close)} · candle age ${c.age_seconds}s · ${c.stale?"<b style='color:#ef4444'>STALE</b>":"fresh"}</div>${card(g)}</div>`)}catch(e){parts.push(`<div class="card"><div class="warn">${s}: ${e}. Signals disabled.</div></div>`)}}
  if(S.view=="Dashboard")$("main").innerHTML=parts.join("")};await load();tmr=setInterval(load,30000)}
function chartView(){$("main").innerHTML=`<div class="card mu" id="st">Connecting…</div><div id="chart"></div><div class="card" id="sig"></div>`;
 chart=LightweightCharts.createChart($("chart"),{layout:{background:{color:"#0b0f14"},textColor:"#8b98a5"},grid:{vertLines:{color:"#161e29"},horzLines:{color:"#161e29"}},timeScale:{timeVisible:true}});
 const cs=chart.addCandlestickSeries();let lines=[],first=true;
 const apply=d=>{if(d.error){$("sig").innerHTML=`<div class="warn">Data error: ${d.error}. Signals disabled.</div>`;return}
  cs.setData(d.candles.candles);if(first){chart.timeScale().fitContent();first=false}
  $("st").textContent=`${d.candles.provider} · live via WebSocket · last closed ${d.candles.last_closed_candle.slice(11,16)}Z · age ${d.candles.age_seconds}s · ${d.candles.stale?"STALE/DELAYED":"fresh"}`;
  lines.forEach(l=>cs.removePriceLine(l));lines=[];const g=d.signal;
  if(g.entry)[[g.entry,"#60a5fa"],[g.stop_loss,"#ef4444"],...g.take_profit.map(t=>[t,"#22c55e"])].forEach(([p,c])=>lines.push(cs.createPriceLine({price:p,color:c})));
  $("sig").innerHTML=card(g)};
 ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+`/ws/${S.sym}/${S.tf}`);ws.onmessage=e=>apply(JSON.parse(e.data));
 ws.onclose=()=>{$("st").textContent="WebSocket closed - retrying with polling";tmr=setInterval(async()=>{try{apply({candles:await api(`/api/candles/${S.sym}/${S.tf}`),signal:await api(`/api/signal/${S.sym}/${S.tf}`)})}catch(e){apply({error:e})}},20000)}}
async function History(){$("main").innerHTML=`<div class="card">Loading…</div>`;try{const h=await api("/api/history");
 $("main").innerHTML=`<div class="card"><h3>Signal history</h3><p class="mu">Outcomes are theoretical (SL checked first when a candle touches both). They are not executed trades.</p><table><tr><th>Time</th><th>Pair</th><th>TF</th><th>Side</th><th>Entry</th><th>SL</th><th>Conf</th><th>Outcome</th></tr>${h.map(r=>`<tr><td>${r.created.slice(5,16)}</td><td>${r.sym}</td><td>${r.tf}</td><td class="${r.side=="BUY"?"buy":"sell"}">${r.side}</td><td>${r.entry}</td><td>${r.stop_loss}</td><td>${r.confidence}</td><td>${r.outcome}</td></tr>`).join("")||"<tr><td>No signals yet</td></tr>"}</table></div>`}catch(e){$("main").innerHTML=`<div class="warn">${e}</div>`}}
const mt=(n,m)=>`<tr><td><b>${n}</b></td><td>${m.trades}</td><td>${m.win_rate??"-"}%</td><td>${m.profit_factor??"-"}</td><td>${m.expectancy_R??"-"}</td><td>${m.max_drawdown_R??"-"}</td><td>${m.avg_planned_RR??"-"}</td><td>${m.net_R??"-"}</td></tr>`;
function Backtest(){const c=COST[S.sym];$("main").innerHTML=`<div class="card"><h3>Backtest ${S.sym} ${S.tf}</h3><p class="mu">Pick instrument:</p><div id="bs"></div><p>Spread <input id="sp" value="${c[0]}"> Slippage <input id="sl" value="${c[1]}"> Comm % <input id="cm" value="${c[2]*100}"> OOS <input id="oo" value="0.3"> Bars <input id="nb" value="2500"> Exit at TP <select id="tg"><option value="0">1</option><option value="1" selected>2</option><option value="2">3</option></select> <button id="go">Run</button></p><div id="res" class="mu">Uses your uncached provider credits (2 requests). Takes ~10-60s.</div></div>`;
 $("bs").replaceChildren(...["BTCUSD","XAUUSD"].map(s=>bt(s,S.sym==s,()=>{S.sym=s;Backtest()})));
 $("go").onclick=async()=>{$("res").textContent="Running…";try{const r=await api(`/api/backtest/${S.sym}/${S.tf}?spread=${$("sp").value}&slip=${$("sl").value}&comm=${$("cm").value/100}&oos=${$("oo").value}&bars=${$("nb").value}&target=${$("tg").value}`);
  $("res").innerHTML=`<p>Bars tested ${r.bars_tested} · theoretical signals ${r.theoretical_signals} · executed trades ${r.executed_trades}</p><table><tr><th></th><th>Trades</th><th>Win</th><th>PF</th><th>Exp(R)</th><th>MaxDD(R)</th><th>Plan RR</th><th>Net R</th></tr>${mt("In-sample",r.in_sample)}${mt("Out-of-sample",r.out_of_sample)}${mt("All",r.all)}</table><p class="mu">${r.assumptions} Past results do not guarantee future results; small trade counts are statistically weak.</p>`}catch(e){$("res").innerHTML=`<div class="warn">${e}</div>`}}}
async function Settings(){const c=await api(`/api/settings/${S.sym}/${S.tf}`);const f=(k,v)=>`<td>${k}</td><td><input id="f_${k}" value="${v}"></td>`;
 $("main").innerHTML=`<div class="card"><h3>Strategy: ${S.sym} ${S.tf} (${c.name})</h3><div id="bs"></div><table><tr>${f("atr_sl",c.atr_sl)}${f("min_conf",c.min_conf)}</tr><tr>${f("adx_min",c.adx_min)}${f("expiry_bars",c.expiry_bars)}</tr><tr><td>TP R multiples</td><td colspan=3><input id="f_rr" value="${c.rr.join(",")}" style="width:160px"></td></tr></table><p><button id="sv">Save</button> <span id="m" class="mu"></span></p><p class="mu">Change the timeframe at the top to configure another one. Changes apply instantly to live signals and backtests.</p></div>`;
 $("bs").replaceChildren(...["BTCUSD","XAUUSD"].map(s=>bt(s,S.sym==s,()=>{S.sym=s;Settings()})));
 $("sv").onclick=async()=>{try{const b={rr:$("f_rr").value.split(",").map(Number)};["atr_sl","min_conf","adx_min","expiry_bars"].forEach(k=>b[k]=Number($("f_"+k).value));await api(`/api/settings/${S.sym}/${S.tf}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});$("m").textContent="Saved"}catch(e){$("m").textContent=e}}}
go();
</script></body></html>
